<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ASOC load board</title>
    <script src="/js/security.js" defer></script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #111114;
        --panel: #1a1a1f;
        --line: #2a2a32;
        --text: #ececec;
        --muted: #9a9aa3;
        --accent: #6ea8ff;
        --ok: #7dcea0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 15px/1.45 system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 24px;
        border-bottom: 1px solid var(--line);
      }
      h1 { font-size: 16px; font-weight: 600; margin: 0; }
      .muted { color: var(--muted); font-size: 13px; }
      main { display: grid; grid-template-columns: 1.4fr 0.8fr; min-height: calc(100vh - 57px); }
      .list { padding: 16px 24px; }
      .side { padding: 16px 24px; border-left: 1px solid var(--line); background: var(--panel); }
      .row {
        border: 1px solid var(--line);
        padding: 12px 14px;
        margin-bottom: 8px;
        cursor: pointer;
        background: var(--bg);
      }
      .row[data-selected="true"] { border-color: var(--accent); }
      .row h2 { margin: 0 0 4px; font-size: 14px; font-weight: 600; }
      .load-summary { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
      .load-summary.no-photo { grid-template-columns: 1fr; }
      .load-photo { width: 72px; height: 54px; object-fit: cover; border: 1px solid var(--line); }
      .specs { margin-top: 4px; color: var(--text); font-size: 12px; }
      .empty { color: var(--muted); padding: 28px 0; text-align: center; }
      label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 6px; }
      input {
        width: 100%;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--line);
        padding: 8px 10px;
      }
      button {
        margin-top: 12px;
        margin-right: 8px;
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--text);
        padding: 8px 12px;
        cursor: pointer;
      }
      button.primary { border-color: var(--accent); color: var(--accent); }
      .ok { color: var(--ok); }
      pre { white-space: pre-wrap; font-size: 12px; color: var(--muted); }
      #cookie-policy {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 8px 24px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <div id="cookie-policy" hidden>
      <span id="cookie-status">Setting secure session cookies…</span>
      <a href="/api/security/policy" style="color:var(--accent)">Cookie policy</a>
    </div>
    <header>
      <div>
        <h1>ASOC load board</h1>
        <div class="muted">Live from Postgres. Voice and tap share one accept flow. Public ledger: <a href="/feed" style="color:var(--accent)">/feed</a></div>
      </div>
      <div class="muted" id="live">connecting…</div>
    </header>
    <main>
      <section class="list">
        <div class="muted">Available loads only. Once a driver claims one, it disappears from this board immediately.</div>
        <div id="loads"></div>
      </section>
      <aside class="side">
        <label for="driverId">Driver ID</label>
        <input id="driverId" placeholder="DRV-104" autocomplete="off" />
        <button class="primary" id="acceptTap" type="button">Accept load</button>
        <button id="listen" type="button">Speak command</button>
        <p class="muted" id="heard"></p>
        <p id="status"></p>
        <h2 style="font-size:13px;margin:24px 0 8px">Voice audit</h2>
        <pre id="audit"></pre>
      </aside>
    </main>
    <script>
      const loadsEl = document.getElementById("loads");
      const heardEl = document.getElementById("heard");
      const statusEl = document.getElementById("status");
      const auditEl = document.getElementById("audit");
      const liveEl = document.getElementById("live");
      const driverEl = document.getElementById("driverId");
      let selected = null;
      let loads = [];

      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function render() {
        if (!loads.length) {
          selected = null;
          loadsEl.innerHTML = `<div class="empty">No available loads right now.</div>`;
          return;
        }
        loadsEl.innerHTML = loads
          .map((load) => {
            const id = load.load_id;
            const sel = selected === id;
            const photos = Array.isArray(load.load_photos) ? load.load_photos : [];
            const photo = photos[0] || "";
            const measurements = [load.load_length, load.load_width, load.load_height];
            const hasDimensions = measurements.every((value) => Number(value) > 0) && Number(load.load_weight) > 0;
            const specs = hasDimensions
              ? `${measurements.join(" × ")} ${load.dimension_unit || "in"} · ${load.load_weight} ${load.weight_unit || "lb"}`
              : "Load photo supplied";
            return `<article class="row" data-id="${id}" data-selected="${sel}">
              <div class="load-summary ${photo ? "" : "no-photo"}">
                ${photo ? `<img class="load-photo" src="${esc(photo)}" alt="Photo of load ${esc(id)}">` : ""}
                <div>
                  <h2>${esc(id)}</h2>
                  <div class="muted">${esc(load.status)} · plate ${esc(load.plate || "—")} · ${esc(load.miles || "—")} mi</div>
                  <div class="specs">${esc(specs)}</div>
                </div>
              </div>
            </article>`;
          })
          .join("");
        loadsEl.querySelectorAll(".row").forEach((row) => {
          row.addEventListener("click", () => {
            selected = row.getAttribute("data-id");
            render();
          });
        });
      }

      async function refreshAudit() {
        const res = await window.asocFetch("/api/voice/actions");
        const data = await res.json();
        auditEl.textContent = (data.actions || [])
          .slice(0, 12)
          .map((a) => `${a.created_at}  ${a.driver_id}  “${a.transcript}”  ${a.intent}${a.accepted ? " → accepted" : ""}`)
          .join("\n") || "No voice actions yet.";
      }

      async function accept(inputMethod, transcript) {
        const driverId = driverEl.value.trim();
        if (!selected) throw new Error("Select a load first");
        if (!driverId) throw new Error("Enter a driver ID");
        const res = await window.asocFetch(`/api/loads/${encodeURIComponent(selected)}/accept`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ driverId, inputMethod, transcript }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "accept failed");
        statusEl.className = "ok";
        statusEl.textContent = `Accepted via ${inputMethod}`;
        loads = loads.filter((load) => load.load_id !== selected);
        selected = loads[0]?.load_id || null;
        render();
        await refreshAudit();
      }

      document.getElementById("acceptTap").addEventListener("click", async () => {
        try {
          await accept("tap");
        } catch (err) {
          statusEl.className = "";
          statusEl.textContent = err.message;
        }
      });

      document.getElementById("listen").addEventListener("click", () => {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) {
          statusEl.textContent = "Speech recognition not available in this browser.";
          return;
        }
        const rec = new SR();
        rec.lang = "en-US";
        rec.interimResults = false;
        rec.onresult = async (event) => {
          const transcript = event.results[0][0].transcript;
          heardEl.textContent = `Heard: “${transcript}”`;
          try {
            await accept("voice", transcript);
          } catch (err) {
            statusEl.className = "";
            statusEl.textContent = err.message;
            await refreshAudit();
          }
        };
        rec.onerror = () => {
          statusEl.textContent = "Mic error";
        };
        rec.start();
        heardEl.textContent = "Listening…";
      });

      const stream = new EventSource("/api/loads/available/stream");
      stream.addEventListener("snapshot", (event) => {
        loads = JSON.parse(event.data);
        liveEl.textContent = "live";
        if (!loads.some((load) => load.load_id === selected)) {
          selected = loads[0]?.load_id || null;
        }
        render();
      });
      stream.addEventListener("load", (event) => {
        const load = JSON.parse(event.data);
        const i = loads.findIndex((x) => x.load_id === load.load_id);
        if (i >= 0) loads[i] = load;
        else loads.unshift(load);
        render();
      });
      stream.addEventListener("remove", (event) => {
        const { loadId } = JSON.parse(event.data);
        loads = loads.filter((load) => load.load_id !== loadId);
        if (selected === loadId) selected = loads[0]?.load_id || null;
        render();
      });
      stream.onerror = () => {
        liveEl.textContent = "reconnecting";
      };

      refreshAudit();
    </script>
  </body>
</html>
